services:
  pd:
    image: pingcap/pd:latest
    container_name: vet-pd
    restart: unless-stopped
    command:
      - --name=pd1
      - --client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://pd:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-peer-urls=http://pd:2380
      - --data-dir=/data/pd1
      - --initial-cluster=pd1=http://pd:2380
    volumes:
      - vet-pd-data:/data/pd1
    ports:
      - "2379:2379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:2379/pd/api/v1/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tikv:
    image: pingcap/tikv:latest
    container_name: vet-tikv
    restart: unless-stopped
    depends_on:
      pd:
        condition: service_healthy
    command:
      - --pd=pd:2379
      - --advertise-addr=tikv:20160
      - --data-dir=/data/tikv1
    volumes:
      - vet-tikv-data:/data/tikv1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:20180/status || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    container_name: vet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vet
      POSTGRES_PASSWORD: vet
      POSTGRES_DB: vetdb
      PGDATA: /var/lib/postgresql/data
    volumes:
      - vet-pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vet -d vetdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  vet-bot-go:
    build: .
    container_name: vet-reminder-bot-go
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      tikv:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  vet-pd-data:
  vet-tikv-data:
  vet-pgdata:
